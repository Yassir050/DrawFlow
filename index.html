<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="DrawFlow - A modern interactive drawing application."
    >

    <title>DrawFlow — Creative Drawing App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    🎨
                </div>

                <div>
                    <h1>DrawFlow</h1>
                    <p>Draw. Create. Express.</p>
                </div>

            </div>


            <div class="header-actions">

                <button
                    class="icon-button"
                    id="soundButton"
                    type="button"
                    aria-label="Toggle sound"
                >
                    🔊
                </button>

                <button
                    class="icon-button"
                    id="themeButton"
                    type="button"
                    aria-label="Toggle theme"
                >
                    🌙
                </button>

            </div>

        </header>


        <!-- TOOLBAR -->
        <section class="toolbar">

            <div class="tool-group">

                <button
                    class="tool-button active"
                    data-tool="brush"
                    type="button"
                >
                    ✏️
                    <span>Brush</span>
                </button>

                <button
                    class="tool-button"
                    data-tool="eraser"
                    type="button"
                >
                    🧽
                    <span>Eraser</span>
                </button>

            </div>


            <div class="tool-group">

                <label
                    class="color-control"
                    for="colorPicker"
                >
                    <span>Color</span>

                    <input
                        id="colorPicker"
                        type="color"
                        value="#6366f1"
                    >
                </label>


                <label
                    class="size-control"
                    for="brushSize"
                >
                    <span>Size</span>

                    <input
                        id="brushSize"
                        type="range"
                        min="1"
                        max="50"
                        value="6"
                    >

                    <strong id="sizeValue">
                        6
                    </strong>
                </label>

            </div>


            <div class="tool-group actions">

                <button
                    class="tool-button"
                    id="undoButton"
                    type="button"
                >
                    ↩️
                    <span>Undo</span>
                </button>

                <button
                    class="tool-button"
                    id="redoButton"
                    type="button"
                >
                    ↪️
                    <span>Redo</span>
                </button>

                <button
                    class="tool-button danger"
                    id="clearButton"
                    type="button"
                >
                    🗑️
                    <span>Clear</span>
                </button>

            </div>

        </section>


        <!-- CANVAS AREA -->
        <main class="workspace">

            <div class="canvas-wrapper">

                <canvas
                    id="drawingCanvas"
                ></canvas>

            </div>

        </main>


        <!-- BOTTOM ACTIONS -->
        <section class="bottom-actions">

            <button
                class="secondary-button"
                id="saveButton"
                type="button"
            >
                💾 Save
            </button>

            <button
                class="primary-button"
                id="downloadButton"
                type="button"
            >
                ⬇️ Download PNG
            </button>

        </section>


        <!-- INFO -->
        <section class="info-card">

            <div>
                <strong>DrawFlow</strong>

                <p>
                    Your drawing is automatically saved
                    on this device.
                </p>
            </div>

            <span class="status" id="saveStatus">
                ● Ready
            </span>

        </section>

    </div>


    <!-- TOAST -->
    <div
        class="toast"
        id="toast"
        role="status"
    ></div>


    <script src="script.js"></script>

</body>
</html>
